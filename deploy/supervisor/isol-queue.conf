; Queue worker for isol (inventario-solucoes) on the DigitalOcean droplet.
;
; Published by `envoy run supervisor`, which copies this file to
; /etc/supervisor/conf.d/ and restarts the `isol:` group. Group and program
; names follow the convention of akop-pro-queue.conf on the same host, so
; operations addresses the workers as one thing — `supervisorctl status isol:*`,
; `supervisorctl restart isol:` — without knowing how many lanes exist today.
;
; Until this existed there was NO worker for this app at all: the box ran
; akop-pro's two programs plus alekop.com's horizon and newsletter, and nothing
; for isol. Nothing had piled up only because no queued work had ever been
; triggered in production (0 pending / 0 failed) — the first AI chat reply or
; user invitation would simply have hung.
;
; ONE lane, deliberately, unlike akop-pro's two: every job in this application
; dispatches to `default` (no `$queue` property, no `onQueue()` anywhere), and
; every one of them is a long AI call, so there is no fast lane to protect yet.
; The day a latency-sensitive job arrives — a webhook, say — it needs its own
; queue AND its own program here; naming a queue nobody drains just parks the
; job forever. `QueueConfigurationTest` fails if that ever happens.

[program:isol-queue]
command=php /var/www/isol/public_html/artisan queue:work redis --queue=default --sleep=3 --max-time=3600 --timeout=660
directory=/var/www/isol/public_html
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
; Two processes so a 10-minute flowSpec reply cannot hold up a user invitation
; email. Each process is one more concurrent AI call, so raise it deliberately.
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/isol/public_html/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; 600s — GenerateFlowspecReply and CondenseSubmissionForSlides, the slowest jobs
; here — plus room for the shutdown itself. Supervisor sends SIGTERM, the worker
; finishes the job in hand and exits, and anything still running when the clock
; runs out is SIGKILLed: no failed(), no failed_jobs row, the record left
; `pending` until retry_after hands it to somebody else. Raise this whenever a
; job's $timeout passes it — `QueueConfigurationTest` fails when it does.
stopwaitsecs=660

; Deliberately no --tries/--backoff, unlike akop-pro's lanes: every job class
; here sets its own ($tries = 25, sized for WithoutOverlapping releases, plus a
; backoff() method), and job-level values take precedence — a number on this
; line would only misdescribe what actually happens. --timeout stays under the
; connection's retry_after (900) so redis never hands a still-running job to a
; second worker.

[group:isol]
programs=isol-queue
